<!-- Modal -->
<style>
    #sortable li:hover {
        cursor: pointer;
    }
</style>
<form class="modal fade" id="editModalQuizList" name="editModalQuizList" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header pt-0 pb-0 bg-dark text-xs">
                <small class="text-truncate  text-uppercase mt-1 ml-1" id="myModalLabel">

                    <i class="fa fa-ew-book"></i> <span>{$current_course.course_title$}</span>
                </small>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body mb-1 text-uppercase bg-light">
                <!-- beginform -->
                <div class="text-center" ng-hide="quiz_list.length > 0"><i class="fas fa-3x fa-spinner fa-pulse"></i></div>
                <div style="overflow:hidden; overflow-y:auto">
                    <div class="text-truncate text-center p-0 mb-4 text-bold">
                        <i class="fa fa-ew-quiz mr-2 text-red"></i>{{JR.quizzes}} : {$quiz_list.length$}
                    </div>

                    <ul id="sortable" class="sortable-list" ng-model="ch">
                        <li id="{$ $index $}" ng-repeat="qz in quiz_list | orderBy:'sequence'"
                            class="text-truncate  elevation-1 mb-4 btn-light rounded text-xs"
                            ng-click="editQuizClick($event,qz)"
                            title="{{JR.edit}} : {{JR.quiz}}">

                            <div class="text-truncate text-sm pb-3">
                                <b class="ml-2 ">{$qz.sequence | numberToLetter$}-</b>  <small class="text-sm">{$ qz.quiz_name  $} </small>
                            </div>
                            <small class="text-right d-block bg-transparent border-0 mr-0 rounded-top muted ">
                                <b ng-class="qz.is_visible?'text-success':'text-danger'">{$ qz.is_visible?'{{JR.online}}':'{{JR.offline}}' $}</b> | <b>{$ qz.date_update |localeDate $}</b> | {{JR.questions}} : <b class="">{$ qz.questions.length  $} </b>
                            </small>
                        </li>
                    </ul>
                </div>
                <!-- endform -->

            </div>
            <div class=" footer-fix text-center">

                <div class="d-inline-block text-center">
                    <button type="button" class="btn btn-default" data-dismiss="modal">{{JR.close}}</button>
                </div>
            </div>
        </div>
    </div>
</form>
