<!-- Modal -->
<style>
   
</style>
<form class="modal fade" id="editModalQuizList" name="editModalQuizList" ng-submit="submitQuizSequence(quiz_sequence_list,'{{course_quiz_sequence_update_url}}')" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog modal-fullscreen" role="document">
        <div class="modal-content">
            <div class="modal-header bg-primary">
                <small class="text-truncate  text-uppercase mt-1 ml-1" id="myModalLabel">
                    <i class="fas fa-sort-numeric-down mr-2 text-warning"></i>{{JR.order_items_list}}
                </small>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body mb-1 bg-light" style="overflow:hidden; overflow-y:auto">
                <div class="mb-4 text-uppercase  text-center text-xs">{{JR.drag_drop_help}} :</div>
                <!-- beginform -->
                <div class="text-uppercase">
                    <ul id="sortableQ" class="sortable-list"  ng-model="qz">
                        <li id="{$ $index $}" ng-repeat="qz in quiz_sequence_list track by $index" 
                            class="ui-state-default text-truncate  elevation-1">
                            <div class="text-truncate text-md">
                                <i class="fa-solid fa-grip-vertical align-self-start handle ui-sortable-handle" style="cursor:grab"></i><b class="ml-2">{$qz.sequence $}-</b> <small>{$ qz.quiz_name $}</small>
                            </div>                       
                            <small class="float-right elevation-3 rounded-top" ng-class="qz.is_visible?'bg-success':'bg-danger'"> 
                                <b>{$ qz.is_visible ?'{{JR.online}}':'{{JR.offline}}' $}</b> 
                            </small>
                        </li>
                    </ul>
                </div>
                <!-- endform -->
                <div class="pt-5 pb-5"></div>
            </div>
            <div class="footer-fix text-center">
                <div class="d-inline-block text-center">
                    <button type="submit" class="btn btn-danger mr-2">{{JR.save_sequence}}</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">{{JR.close}}</button>
                </div>
            </div>
        </div>
    </div>
</form>
