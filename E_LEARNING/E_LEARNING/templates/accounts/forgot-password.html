{% extends "_layouts/layout-account.html" %}
{% block head %}
{% endblock %}
{% block content %}
<div class="card-body" ng-controller="ForgotPasswordCtrl">
    <p class="login-box-msg">{{JR.forgot_password_description}}.</p>
    <form autocomplete="off" ng-submit="submitForm('{{forgot_password_url}}')" onsubmit="return false;" method="post" name="form_{{app_version()}}">
        <div class="input-group mb-3">
            <input ng-model="user.email" type="email" required class="form-control " placeholder="{{JR.email}}">

            <div class="input-group-append">
                <div class="input-group-text">
                    <span class="fas fa-envelope"></span>
                </div>
            </div>
        </div>
        <div class="input-group mb-3">
            <input ng-model="user.phone_primary" intl-tel-input type="tel" required class="form-control " placeholder="{{JR.phone}}">

            <div class="input-group-append">
                <div class="input-group-text">
                    <span class="fas fa-phone"></span>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-lock mr-2"></i> {{JR.forgot_password_get_new}}</button>
            </div>
            <!-- /.col -->
        </div>
    </form>
    <hr />
    <p class="mt-2 mb-1">
        <small class="text-black"><a href="{{url_for('AccountView:login')}}"><i class="fa fa-arrow-alt-circle-left mr-2"></i> {{JR.no_thanks}} !</a></small>
    </p>
</div>
{% endblock %}
{% block contentBottom %}{% endblock %}
{% block scripts %}

<script src="/static/plugins/jquery/jquery.redirect.js"></script>
<script src="/static/app-core/accounts/app.account.min.js?version={{app_version()}}"></script>
{% endblock %}
