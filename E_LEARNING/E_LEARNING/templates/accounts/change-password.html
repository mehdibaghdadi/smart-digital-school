{% extends "_layouts/layout.html" %}
{% block head %}
{% endblock %}
{% block content %}
<div ng-controller="ChangePasswordCtrl">
    <br />
    <small class="login-box-msg mt-5 text-uppercase d-block">
        <span class="fas fa-lock fa-5x p-2"></span><br />
        {{JR.change_password_description}}.
    </small>
    <form name="form-new-password" autocomplete="off" ng-submit="submitForm('{{change_password_url}}')" method="post" 
          class="row justify-content-center" ng-init="init({{user}})">
        <div class="col-md-3"></div>
        <div class="col-md-6  elevation-3 bg-light p-2 rounded-lg ">
            <div class="input-group mb-3">
                <input id="login" name="log" type="email" required ng-model="user.email" class="form-control" autocomplete="new-password" placeholder="1- {{JR.login_email2}}" value="">
                <div class="input-group-append">
                    <div class="input-group-text">
                        <span class="fa fa-at"></span>
                    </div>
                </div>
            </div>

            <div class="input-group mb-3">
                <input id="old_pass" type="password" data-type="password" required ng-model="user.old_password" autocomplete="new-password" class="form-control" placeholder="2- {{JR.current_password}}">
                <div class="input-group-append">
                    <div class="input-group-text">
                        <span onclick="tooglePassword('#old_pass','#toggle_eye1')" id="toggle_eye1" role="button" class="fas fa-eye text-green"></span>
                    </div>
                </div>
            </div>

            <div class="input-group mb-3">
                <input id="pass" type="password" data-type="password" required ng-model="user.password" autocomplete="new-password" class="form-control" placeholder="3- {{JR.new_password}}">
                <div class="input-group-append">
                    <div class="input-group-text">
                        <span onclick="tooglePassword('#pass','#toggle_eye2')" id="toggle_eye2" role="button" class="fas fa-eye text-red"></span>
                    </div>
                </div>
            </div>

            <div class="input-group mb-3">
                <input id="pass-confirm" type="password" data-type="password" required ng-model="user.password_confirm" autocomplete="new-password" class="form-control" placeholder="4- {{JR.confirm_password}}">
                <div class="input-group-append">
                    <div class="input-group-text">
                        <span onclick="tooglePassword('#pass-confirm','#toggle_eye3')" id="toggle_eye3" role="button" class="fas fa-eye text-red"></span>
                    </div>
                </div>
            </div>
            <div class="footer-fix">
                <button type="submit" class="btn btn-primary mr-1"><i class="fa fa-save mr-2"></i>{{JR.change_password}}</button>
                <button type="button" class="btn  btn-danger m-1" onclick="goBack();">
                    <i class="fa fa-reply mr-2"></i> {{JR.back}}
                </button>
            </div>
        </div>
        <div class="col-md-3"></div>
    
    </form>
</div>

{% endblock %}
{% block contentBottom %}{% endblock %}
{% block scripts %}
<script src="/static/app-assets/js/password-manager.min.js?version={{app_version()}}"></script>
<script src="/static/app-core/accounts/app.account.min.js"></script>
{% endblock %}
