<div class="card-body row">
    <div class="form-group col-md-6">
        <label>{{JR.login_email}}</label>
        <input ng-model="user.email" type="text" readonly class="form-control rounded-0" placeholder="">
    </div>
    <div class="form-group col-md-6">
        <label>{{JR.date_subscribed}}</label>
        <input ng-model="user.registration_date" type="text" readonly class="form-control rounded-0" placeholder="">
    </div>
    <div class="form-group col-md-12">
        <label>{{JR.name_establishment}}</label>
        <input ng-model="user.name" type="text" required class="form-control " placeholder="">
    </div>
    <div class="form-group col-md-6">
        <label>{{JR.phone1}}</label>
        <input ng-model="user.phone_primary" intl-tel-input type="tel" required class="form-control " placeholder="">
    </div>
    <div class="form-group col-md-6">
        <label>{{JR.phone2}}</label>
        <input ng-model="user.phone_secondary" intl-tel-input type="tel" class="form-control " placeholder="">
    </div>
    <div class="form-group col-md-6">
        <label>{{JR.country}}</label>
        <select id="country-selector" ng-model="user.country_id" class="js-example-basic-single form-control rounded-0 p-0 ddl-selector">
            {% for c in countries %}
            <option ng-value="{{c.id}}" class="ml-2"> &bull; {{c.country}}</option>
            {% endfor %}
        </select>

    </div>
    <div class="form-group col-md-6" ng-hide="city_available.indexOf(user.country_id)<0">
        <label>{{JR.city}}</label>
        <select id="city-selector" ng-model="user.country_city_id" class="js-example-basic-single form-control rounded-0 p-0 ">
            {% for r, list_group in cities|groupby('region') %}
            {% for region, list in list_group|groupby('region') %}
            <optgroup label="{{ region }} ">
                {% for c in list %}
                <option ng-value="{{c.id}}" class="ml-2"> &bull; {{c.city}}</option>
                {% endfor %}
            </optgroup>
            {% endfor %}
            {% endfor %}
        </select>
    </div>
    <div class="form-group col-md-12">
        <label>{{JR.address}}</label>
        <textarea ng-model="user.address" type="text" class="form-control rounded-0" placeholder=""></textarea>
    </div>
    <div class="form-group col-md-12">
        <label>{{JR.my_description}}</label>
        <textarea ng-model="user.introduction_brief" type="text" class="form-control rounded-0" rows="5" placeholder=""></textarea>
    </div>
</div>
