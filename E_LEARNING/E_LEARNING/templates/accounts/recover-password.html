{% extends "_layouts/layout-account.html" %}
{% block head %}
{% endblock %}
{% block content %}

<div class="card-body" ng-controller="RecoverPasswordCtrl">
    <p class="login-box-msg text-sm">
        {{JR.last_step}}.<br />
        <b>{{JR.check_your_email}}.</b><br />
        {{JR.recover_password_description}}.
    </p>
    <form name="form_{{app_version()}}" ng-submit="submitForm('{{reset_password_url}}')" method="post">
        <div class="input-group mb-3 justify-content-center mb-3">
            <div class="input-group-prepend">
                <div class="input-group-text">
                    Code
                </div>
            </div>
            <input ng-required="true" tabindex="0" ng-model="user.code_digit" style="max-width:140px" 
                   title="{{JR.code_required}}" data-mask inputmode="numeric" 
                   data-inputmask='"mask": "9  9  9  9"' type="text" 
                   name="coderecovery{{app_version()}}" class="form-control text-bold text-center text-red" 
                   placeholder="_  _  _  _">
            <div class="input-group-append">
                <div class="input-group-text">
                    <span class="fas fa-qrcode text-danger"></span>
                </div>
            </div>

        </div>
        <div class="input-group mb-3">
            <input ng-model="user.password" id="pass" data-type="password" type="password" name="pass{{app_version()}}" class="form-control" required placeholder="{{JR.new_password}}">
            <div class="input-group-append">
                <div class="input-group-text">
                    <span onclick="tooglePassword('#pass','#toggle_eye1')" id="toggle_eye1" role="button" class="fas fa-eye text-red"></span>
                </div>
            </div>
        </div>
        <div class="input-group mb-3">
            <input ng-model="user.password_confirm" id="pass-confirm" data-type="password" type="password" name="pass_confirm{{app_version()}}" class="form-control" required placeholder="{{JR.confirm_password}}">
            <div class="input-group-append">
                <div class="input-group-text">
                    <span role="button" onclick="tooglePassword('#pass-confirm','#toggle_eye2')" id="toggle_eye2" class="fas fa-eye text-red"></span>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <button type="submit" class="btn btn-primary btn-block">{{JR.change_password}}</button>
            </div>
            <!-- /.col -->
        </div>
        <input id="__isds_h" name="__isds_h" type="hidden" ng-init="user.id='{{id}}'">
        <input id="__esds_h" name="__esds_h" type="hidden" ng-init="user.email='{{email}}'">
        <input id="__rsds_h" name="__esds_h" type="hidden" ng-init="user.role='{{role}}'">
    </form>
    <hr />
    <div class="mt-2 mb-1">
        <small><a href="{{url_for('AccountView:login')}}"><i class="fa fa-users mr-2"></i> {{JR.login}}</a></small>
    </div>
</div>

{% endblock %}
{% block contentBottom %}{% endblock %}
{% block scripts %}
<script src="/static/plugins/jquery/jquery.redirect.js"></script>
<script src="/static/app-assets/js/password-manager.min.js?version={{app_version()}}"></script>
<script src="/static/app-core/accounts/app.account.min.js?version={{app_version()}}"></script>

{% endblock %}
