<div class="row">
    <div class="col-12 text-left text-black" style="text-decoration:underline">
        <i class="fab fa-dropbox text-info"></i><b>{{JR.contents}}  : <span class="text-md text-info">{$ total_course_content $}</span>  {{JR.online}}</b>
    </div>
    <!--progress bars -->
    <div class="col-md-12 ">
        <div style="position:absolute;right:0px" class="float-right" ng-hide="course_chapter_contents_loaded">
            <i class="fas fa-2x fa-sync-alt fa-spin"></i>
        </div>
        <div class="pb-4"></div>
        <div class="progress-group d-flex justify-content-around flex-wrap">

            <div ng-repeat="ch in list_content_type track by $index" class="d-flex flex-column align-items-center" >
                <small><i class="pr-2" ng-class="ch.params.css +' '+ch.params.color"></i><b>{$ch.params.text$}</b></small>
                <div class="elevation-2 progress-circle p{$ch.percent || 0$}" ng-class="(ch.percent||0)>50 ? 'over50 ':''">
                    <span>{$ ch.percent || 0 $} <i class="fa fa-percent"></i></span>
                    <div class="left-half-clipper">
                        <div class="first50-bar"></div>
                        <div class="value-bar"></div>
                    </div>
                </div>
            </div>

            <!--<small class="text-uppercase font-weight-bold"><i class="pr-2 fa text-dark" ng-class="ch.params.css"></i>{$ch.params.text$}</small>
            <span class="float-right"><b>{$ch.count$}</b>/{$total_course_content$}</span>
            <div class="progress progress-sm">
                <div class="progress-bar bg-progress-bar rounded-right" ng-class="ch.params.bg" ng-style="{'width':((ch.count*100)/total_course_content | number)+'%'}"></div>
            </div>
            <div class="pt-3"></div>-->
        </div>
        <div class="text-center text-sm"><span ng-bind-html="title_content_progress_bottom | toHtml">{$$}</span></div>
        <div class="pt-3"></div>
    </div>
    <!--graphs-->
    <div class="col-md-12 ">
        <div style="position:absolute;right:0px" class="float-right" ng-hide="course_chapter_contents_loaded">
            <i class="fas fa-2x fa-sync-alt fa-spin"></i>
        </div>
        <div style="height:300px;width:100%">
            <canvas id="chart_contents_type_courses" style="height:300px;width:100%"></canvas>
        </div>
    </div>
</div>
