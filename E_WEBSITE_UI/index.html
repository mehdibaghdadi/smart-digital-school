<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Primaire -->
    <title>Smart Digital School | Plateforme de Formation & Écoles Digitales</title>
    <meta name="description" content="Smart Digital School est la plateforme leader pour la création d'écoles digitales et la formation à distance. Gérez vos cours, vos élèves et votre croissance en toute simplicité." />
    <meta name="keywords" content="école digitale, formation à distance, e-learning, plateforme éducative, LMS, Smart Digital School, éducation numérique" />
    <meta name="author" content="Smart Digital School" />
    <link rel="canonical" href="https://smartdigitalschool.com" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartdigitalschool.com" />
    <meta property="og:title" content="Smart Digital School | Plateforme de Formation & Écoles Digitales" />
    <meta property="og:description" content="Créez et gérez votre école digitale avec la plateforme la plus moderne du marché. Formation à distance simplifiée." />
    <meta property="og:image" content="https://smartdigitalschool.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://smartdigitalschool.com" />
    <meta property="twitter:title" content="Smart Digital School | Plateforme de Formation & Écoles Digitales" />
    <meta property="twitter:description" content="Créez et gérez votre école digitale avec la plateforme la plus moderne du marché. Formation à distance simplifiée." />
    <meta property="twitter:image" content="https://smartdigitalschool.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Données Structurées JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Smart Digital School",
        "url": "https://smartdigitalschool.com",
        "logo": "https://smartdigitalschool.com/logo.png",
        "description": "Plateforme moderne de formation à distance et création d'écoles digitales.",
        "sameAs": [
          "https://facebook.com/smartdigitalschool",
          "https://linkedin.com/company/smartdigitalschool"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://smartdigitalschool.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://smartdigitalschool.com/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
